<!DOCTYPE html>
<html>

<head>

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:#f5f2e8;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

font-family:Segoe UI;

}

.card{

width:420px;

padding:40px;

border:none;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.btn-primary{

background:#163f6d;

border:none;

}

</style>

</head>

<body>

<div class="card">

<h2 class="mb-4 text-center">
Create Account
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}

{% for category, message in messages %}

<div class="alert alert-{{ category }}">

{{ message }}

</div>

{% endfor %}

{% endif %}
{% endwith %}
</h2>

<form method="POST">

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-4">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button class="btn btn-primary w-100">

Register

</button>

<div class="text-center mt-3">

Already have an account?

<a href="/login">

Login

</a>

</div>

</form>

</div>

</body>

</html>
